name: 검사

# PR 과 main 브랜치에 대해 테스트·타입 검사를 돌린다.
# 실기기 없이 확인할 수 있는 것은 여기서 전부 막아 준다 (docs/완료기준.md 참조).
on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에서 새로 밀면 이전 실행은 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 토큰에 읽기 권한만 준다. 이 검사는 저장소에 아무것도 쓰지 않는다.
permissions:
  contents: read

jobs:
  test:
    name: 테스트 · 타입 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 미만으로 낮추지 말 것.
          # 테스트는 node 의 타입 지우기(--experimental-strip-types)로 도는데,
          # 그 기능이 22.6 부터 들어왔다. 20 에서는 테스트가 아예 실행되지 않는다.
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 보안 코어 단위 테스트
        run: npm test

      - name: 코어 타입 검사 (엄격)
        run: npm run typecheck:core

      - name: 앱 전체 타입 검사
        run: npm run typecheck
